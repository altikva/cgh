# Build the standalone binaries and attach them to a GitHub Release.
#
# Reusable workflow (workflow_call). It is deliberately decoupled from PyPI:
# building a binary and publishing the package no longer share a tag, so a
# binary leg that fails (or a fix that lands after a release) can be rebuilt
# and attached to the existing Release without republishing to PyPI.
#
# Callers:
#   release.yml  -> on a tag push, build_ref = the tag, release_tag = the tag.
#   binaries.yml -> on workflow_dispatch, build_ref and release_tag are inputs,
#                   so a published Release can be completed after the fact.
#
# The Release named by release_tag must already exist; this only uploads.

name: Build standalone binaries

on:
  workflow_call:
    inputs:
      build_ref:
        description: Git ref (branch, tag or SHA) to check out and build from.
        required: true
        type: string
      release_tag:
        description: Existing GitHub Release tag to attach the binaries to.
        required: true
        type: string

jobs:
  binaries:
    name: Binary ${{ matrix.variant }} (${{ matrix.plat.target }})
    # One leg failing (Windows is the usual suspect) loses only that asset, it
    # does not block the others. PyInstaller does not cross-compile, so each
    # target builds on its own native runner.
    #
    # TWO variants per target (see packaging/build-binary.sh), named for
    # EGRESS, not a plugin count:
    #   sealed -> cgh-<target>         : core only, document parsers
    #             included. Provably egress-free, so "the core never phones
    #             home" stays verifiable by absence of the code, not a flag.
    #   egress -> cgh-egress-<target>  : adds the egress-capable default
    #             plugins (codegen, bugreport), inert until configured. The
    #             name is the honest capability, not a state.
    # pii and vision are not in the default install and stay pip-only in
    # both.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [sealed, egress]
        # macOS x64 (Intel) is intentionally absent: GitHub retired the
        # `macos-13` hosted image (the last Intel macOS runner), so those legs
        # queue forever against a label no runner matches. PyInstaller does not
        # cross-compile, so an arm64 runner cannot produce an Intel binary.
        # Intel-Mac users install with Python instead (`uvx cgh` / `pip install
        # cgh`); the npx wrapper tells them so rather than 404ing.
        plat:
          - { target: macos-arm64, runner: macos-14 }
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: windows-x64, runner: windows-latest }
    runs-on: ${{ matrix.plat.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.build_ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build the binary
        shell: bash
        env:
          CGH_VARIANT: ${{ matrix.variant }}
        run: bash packaging/build-binary.sh

      - name: Stage the asset + checksum
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.plat.target }}
        run: |
          # sealed -> cgh-<target>, egress -> cgh-egress-<target>; .exe on Windows.
          prefix="cgh"; [ "$VARIANT" = egress ] && prefix="cgh-egress"
          asset="$prefix-$TARGET"
          # PyInstaller writes cgh (cgh.exe on Windows) into dist-binary/dist.
          src="dist-binary/dist/cgh"
          if [ -f "$src.exe" ]; then src="$src.exe"; asset="$asset.exe"; fi
          mkdir -p out
          cp "$src" "out/$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          ls -lh

      - name: Smoke-test + verify bundled plugins and document readers
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          chmod +x "out/$ASSET" 2>/dev/null || true
          "./out/$ASSET" --version
          # The binary is only as bundled as its metadata: without --copy-metadata
          # the plugins vanish silently. Assert the expected set is ACTIVE in the
          # built binary itself, not in the source tree.
          expected=""
          [ "$VARIANT" = egress ] && expected="codegen bugreport"
          python3 - "out/$ASSET" $expected <<'PY'
          import json, subprocess, sys
          binp, expected = sys.argv[1], set(sys.argv[2:])
          out = subprocess.run([binp, "plugins", "--json"], capture_output=True, text=True)
          data = json.loads(out.stdout or "[]")
          active = {p["name"] for p in data if p.get("status") == "active"}
          print("active plugins:", sorted(active))
          missing = expected - active
          if missing:
              sys.exit(f"FAIL: expected plugins not active in the binary: {sorted(missing)}")
          print("all expected plugins active")
          PY
          # The document parsers import their readers lazily and skip a format
          # whose reader is missing, so a binary that forgot one would still
          # start. Index one file of each format and require a section from
          # every one of them. The fixture writers run in a throwaway uv env;
          # the binary under test is the only cgh involved.
          uv run --no-project --with python-docx --with openpyxl --with python-pptx \
            python packaging/smoke_documents.py "./out/$ASSET"

      - name: Upload to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" "out/$ASSET" "out/$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
