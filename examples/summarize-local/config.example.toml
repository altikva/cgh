# Description: Every cgh-summarize backend knob with its default. Load
#              it yourself (tomllib) and pass the dict to
#              sdk.summarize(text, config). In a cgh repo the same keys
#              live under [plugin.summarize] in .codegraph/config.toml.

# Force one backend instead of the auto order (local daemon, then a
# loopback OpenAI-compatible server, then the model-free structural
# fallback). Names: ollama, openai, structural. cgh-summarize 0.3.0
# removed the agent CLI backends and never uses a cloud one.
backend = "auto"

# Local daemon. Only a loopback URL counts as a local backend; any
# other host classifies as cloud and is never used.
ollama_url = "http://127.0.0.1:11434"
#ollama_model = "qwen2.5:1.5b"

# An OpenAI-compatible server on this machine: llama-server, vLLM,
# LM Studio. A non-loopback base URL is never used.
#openai_base_url = "http://127.0.0.1:8000/v1"
#openai_model = "my-model"
#openai_api_key_env = "OPENAI_API_KEY"

# Output language of the summaries.
#language = "en"
