[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cgh-summarize"
version = "0.1.1"
description = "File summaries for cgh behind a confidentiality egress gate: agent CLIs, Ollama or any OpenAI-compatible endpoint, plus corpus-level insights"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-NC-SA-4.0"
authors = [{ name = "Joy Ndjama", email = "joy.ndjama@altikva.com" }]
# cgh itself is a peer dependency, deliberately not declared: the plugin
# only ever loads through cgh's entry point group, so it is inert without
# cgh installed, and declaring it makes resolvers overlay a second cgh on
# top of a dev checkout. Requires cgh >= 0.6.1 at runtime. Every backend
# uses the standard library (subprocess for agent CLIs, urllib for HTTP).
dependencies = []

[project.entry-points.cgh]
summarize = "cgh_summarize"

[tool.setuptools.packages.find]
include = ["cgh_summarize*"]
