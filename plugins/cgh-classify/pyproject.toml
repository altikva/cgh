[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cgh-classify"
version = "0.2.0"
description = "Frozen: human-trainable confidentiality labels for cgh files, a lightweight local model generalizes them"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joy Ndjama", email = "joy.ndjama@altikva.com" }]
# cgh itself is a peer dependency, deliberately not declared: the plugin
# only ever loads through cgh's entry point group, so it is inert without
# cgh installed, and declaring it makes resolvers overlay a second cgh on
# top of a dev checkout. Requires cgh >= 0.9 and < 0.16 at runtime: 0.9
# for the plugin_api names it imports, and frozen, so untested past the
# 0.15 series. cgh 0.15 refuses releases older than 0.2.0. The classifier
# is pure standard library: TF-IDF plus naive Bayes, no sklearn, no numpy.
dependencies = []

[project.entry-points.cgh]
classify = "cgh_classify"

[tool.setuptools.packages.find]
include = ["cgh_classify*"]

[tool.setuptools.package-data]
cgh_classify = ["py.typed"]
