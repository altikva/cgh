# Description: Every cgh-vision knob with its default. In an embedding
#              application, load this file yourself (tomllib) and pass
#              the dict to the sdk.image_* functions. In a cgh repo the
#              same keys live under [plugin.vision] in
#              .codegraph/config.toml.

# Where the Ollama daemon listens. Keep it loopback for confidential
# images: a remote URL means the raw image bytes travel to that host.
ollama_url = "http://127.0.0.1:11434"

# Or skip Ollama entirely: point at any OpenAI-compatible vision
# endpoint (llama-server on your GGUF, LM Studio, vLLM, a gateway).
# A loopback URL stays local; a remote one is gated like any cloud.
#openai_base_url = "http://127.0.0.1:8080/v1"
#openai_api_key_env = "OPENAI_API_KEY"

# Extraction profile: "default" (three passes, best quality),
# "fast" (single pass), "photo" (screen photos: moire, low contrast).
profile = "default"

# Override the profile's models with any Ollama vision model you
# pulled. Defaults come from the benchmark: qwen reads nodes and
# zones, gemma reads arrows constrained to the found labels.
#nodes_model = "qwen2.5vl:3b"
#edges_model = "gemma3:4b"

# Per model call, seconds. Raise it for large images on CPU-only.
#timeout_s = 120

# Second structure reader, consulted only when the first comes back
# skeletal. Defaults to the arrow model, which needs no extra
# download and won the comparison; empty disables it.
#fallback_model = "gemma3:4b"

# Small images are upscaled 2x (Lanczos) before extraction; the
# benchmark showed this rescues thin-line drawio exports and never
# hurts. Disable or tune the size threshold here.
#prescale = true
#prescale_min_px = 1000

# Scanner-only bounds (ignored by direct SDK calls): images outside
# this size window are skipped during repo indexing.
#min_bytes = 5120
#max_bytes = 20971520
