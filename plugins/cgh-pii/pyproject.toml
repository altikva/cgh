[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cgh-pii"
version = "0.4.0"
description = "Secret scanning and PII redaction for cgh: cgh pii scan finds private keys and credentials on demand, cgh pii redact anonymizes documents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joy Ndjama", email = "joy.ndjama@altikva.com" }]
# cgh itself is a peer dependency, deliberately not declared: the plugin
# only ever loads through cgh's entry point group, so it is inert without
# cgh installed, and declaring it makes resolvers overlay a second cgh on
# top of a dev checkout. Requires cgh >= 0.15 at runtime: codegraph.sdk
# scan_text reads the scanner.on_demand namespace this release registers
# into only from 0.15 on (with an older cgh it finds nothing, as no
# index-time scanner is registered by default any more). cgh 0.15 refuses
# releases older than 0.4.0.
dependencies = []

[project.optional-dependencies]
# NER tier (person names, locations). Heavy: spaCy models. The regex
# tier needs nothing beyond the standard library.
ner = ["presidio-analyzer>=2.2"]
# docx redaction: rewrite a Word document in place or into a new one.
# Text/markdown redaction needs nothing beyond the standard library.
docx = ["python-docx>=1.1"]

[project.entry-points.cgh]
pii = "cgh_pii"

[tool.setuptools.packages.find]
include = ["cgh_pii*"]

[tool.setuptools.package-data]
cgh_pii = ["py.typed"]
