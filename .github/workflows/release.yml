# Publish cgh to PyPI on every tag push.
#
# Auth model: PyPI Trusted Publisher (OIDC). No tokens, no secrets. PyPI
# verifies this workflow's GitHub OIDC identity matches the trusted publisher
# configured on https://pypi.org/manage/project/cgh/settings/publishing/
#
# Trusted publisher settings to configure on PyPI ONCE:
#   Owner:                altikva
#   Repository:           cgh
#   Workflow filename:    release.yml
#   Environment name:     pypi
#
# Release flow:
#   1. Bump version in pyproject.toml + commit + push to main
#   2. git tag v0.4.4 && git push --tags
#   3. This workflow validates, builds, publishes to PyPI, and attaches the
#      dists to the GitHub release.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  # Gate: do not build or publish unless the tag matches the version and the
  # suite is green. CI already runs on the merge to main, but the tag can point
  # at any commit, so re-check here.
  validate:
    name: Validate (tag + lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse manual dispatch from non-main refs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::workflow_dispatch runs only from main"
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          # uv.lock is committed, so the cache key is stable.
          enable-cache: true

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag v$TAG does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "Releasing cgh $PYPROJECT_VERSION"

      - name: Lint with ruff
        # Pinned to match ci.yml, a new ruff release must not block a tag.
        run: |
          uvx ruff@0.15.9 check .
          uvx ruff@0.15.9 format --check .

      - name: Run pytest
        # Validate on the default Python. The full 3.11-3.14 matrix runs in
        # ci.yml on the PR.
        run: uv run --with pytest pytest -q

  build:
    name: Build sdist + wheel
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check metadata
        run: |
          ls -lh dist/
          uvx twine check dist/*

      - name: Smoke-test the built wheel
        # Install the wheel into a clean venv (default extras) and run
        # the CLI, so a broken entry point or missing data file fails here
        # rather than in a user's terminal.
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/cgh --version

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # `pypi` environment scopes the OIDC token PyPI trusts. Create it in
    # repo Settings -> Environments (no required reviewers unless you want a
    # manual gate before each release).
    environment:
      name: pypi
      url: https://pypi.org/project/cgh/
    permissions:
      # Required for the PyPI Trusted Publisher OIDC exchange.
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Defaults to https://upload.pypi.org/legacy/ when the trusted
        # publisher is configured on PyPI. skip-existing lets a
        # workflow_dispatch re-run publish only what is new (plugin
        # versions move independently of the core tag).
        with:
          skip-existing: true

  publish-plugins:
    name: Publish first-party plugins to PyPI
    needs: validate
    runs-on: ubuntu-latest
    # One GitHub environment PER plugin (pypi-cgh-pii, pypi-cgh-vision, ...):
    # PyPI requires every PENDING trusted publisher to have a unique
    # (owner, repo, workflow, environment) configuration, since before
    # the first upload nothing else can map a token to a project name.
    # Each plugin's PyPI entry therefore uses its matching environment;
    # until an entry exists, that plugin's upload fails without blocking
    # the others.
    environment:
      name: pypi-${{ matrix.plugin }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # cgh-docs is not published any more: its parsers are part of the
        # core, and the core ignores an installed copy. Its last release
        # (0.2.0) stays on PyPI.
        plugin:
          - cgh-pii
          - cgh-bugreport
          - cgh-vision
          - cgh-codegen
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build ${{ matrix.plugin }}
        run: uv build plugins/${{ matrix.plugin }} --out-dir plugin-dist/

      - name: Publish ${{ matrix.plugin }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: plugin-dist/
          # A tag that does not bump a plugin's version re-uploads the
          # same file; skip instead of failing the whole release.
          skip-existing: true

  github-release:
    name: Attach dists to GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Upload artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  binaries:
    # Build the standalone binaries on this tag and attach them to the release.
    # Extracted into a reusable workflow (_binaries.yml) so the same build can
    # be re-run for an already-published release via binaries.yml, without
    # republishing to PyPI.
    needs: [validate, github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    uses: ./.github/workflows/_binaries.yml
    with:
      build_ref: ${{ github.ref }}
      release_tag: ${{ github.ref_name }}

  publish-npm:
    name: Publish npx wrapper (@altikva/cgh)
    # Depends on github-release, NOT binaries: the wrapper fetches a binary at
    # runtime, so it only needs the release to exist, and gating it on every
    # binary leg means one stuck runner (a retired image, a queue backlog)
    # blocks the npm publish indefinitely. Decoupled, the binaries upload in
    # parallel; a platform whose asset is not up yet gets a clean "not found"
    # from the launcher for the short window until it lands, rather than the
    # whole package never publishing.
    #
    # Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret. npm mints a
    # short-lived token from this workflow's GitHub OIDC identity, which is why
    # `id-token: write` is required. It works only once the package's trusted
    # publisher is configured on npmjs.com (org altikva, repo cgh, workflow
    # release.yml); until then this job fails alone and blocks nothing else.
    # Trusted publishing needs npm >= 11.5.1, newer than the runner's bundled
    # npm, so we upgrade it first.
    needs: github-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Verify the package version matches the tag
        working-directory: packaging/npm
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::npm package version $PKG does not match tag v$TAG"
            exit 1
          fi
          echo "Publishing @altikva/cgh $PKG"

      - name: Test before publishing
        working-directory: packaging/npm
        run: node --test test/*.test.js

      - name: Publish to npm (OIDC trusted publishing, no token)
        working-directory: packaging/npm
        run: npm publish --provenance --access public
