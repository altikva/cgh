# Lint + test gate. Fires on every PR and on pushes to the long-lived
# branches (develop, main) so the integration history stays green.
# release.yml is the only workflow that touches PyPI.

name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  # Keep uv.lock honest: fail if it has drifted from pyproject.toml. The
  # lock is committed, so the matrix install and the setup-uv cache both
  # rely on it being current.
  lockfile:
    name: uv.lock is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Check lockfile matches pyproject
        run: uv lock --check

  # Style gate: no em or en dashes in shipped prose (the no-ai-tells
  # convention). Cheap, no Python deps, runs once.
  no-ai-tells:
    name: no-ai-tells (no em dashes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check shipped prose for em/en dashes
        run: python3 scripts/check_no_em_dashes.py

  # Gating job: lint + the full supported Python matrix. Kuzu has no cp3.14
  # wheel, so the kuzu extra is installed only on 3.11-3.13; 3.14 runs the
  # default DuckDB-only install and the Kuzu tests skip themselves.
  test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Surface the matrix value via env so run: blocks never interpolate
      # ${{ ... }} straight into the shell.
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          # uv.lock is committed, so the cache key is stable.
          enable-cache: true

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Lint with ruff
        # ruff is not a project dependency, so run it via uvx, pinned so a
        # new ruff release can't break CI out of nowhere (0.16.0 widened the
        # default rule set and flagged 375 pre-existing findings; adopting it
        # deserves its own chore PR). The format check is not enabled yet
        # (69 files would reformat); same story, dedicated chore/ruff-format
        # PR, then add `uvx ruff@0.15.9 format --check .`.
        run: |
          uvx ruff@0.15.9 check .
          uvx ruff@0.15.9 format --check .

      - name: Run pytest
        # First-party plugins from plugins/ join the test env so their
        # suites run end to end instead of import-skipping.
        run: |
          if [ "$PYTHON_VERSION" = "3.14" ]; then
            uv run --python "$PYTHON_VERSION" --with pytest --with ./plugins/cgh-docs --with ./plugins/cgh-pii --with ./plugins/cgh-summarize --with ./plugins/cgh-classify --with ./plugins/cgh-bugreport --with ./plugins/cgh-vision pytest -q
          else
            uv run --python "$PYTHON_VERSION" --with pytest --with ./plugins/cgh-docs --with ./plugins/cgh-pii --with ./plugins/cgh-summarize --with ./plugins/cgh-classify --with ./plugins/cgh-bugreport --with ./plugins/cgh-vision --extra kuzu pytest -q
          fi

  # Advisory early-warning job: resolve the newest deps allowed by the
  # pyproject floors instead of the locked versions. Catches "an upstream
  # release broke us" without blocking PRs on transitive breakage.
  # continue-on-error keeps it non-gating.
  test-latest:
    name: Newest deps, advisory (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Test on newest deps within floors
        run: |
          if [ "$PYTHON_VERSION" = "3.14" ]; then
            uv run --python "$PYTHON_VERSION" --upgrade --with pytest pytest -q
          else
            uv run --python "$PYTHON_VERSION" --upgrade --with pytest --extra kuzu pytest -q
          fi

  test-oldest:
    name: Oldest direct deps, advisory (Python 3.11)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python
        run: uv python install 3.11

      - name: Test on the declared floors
        # A lower bound nobody tests is an intention, not a compatibility
        # statement: resolve every direct dependency to its declared
        # minimum and run the suite against that. The plugins ride along
        # so THEIR floors (pypdf, python-docx, openpyxl, ...) are proven
        # too, not just cgh's own.
        run: uv run --python 3.11 --resolution lowest-direct --with pytest --with ./plugins/cgh-docs --with ./plugins/cgh-pii --with ./plugins/cgh-summarize --with ./plugins/cgh-classify --with ./plugins/cgh-bugreport --with ./plugins/cgh-vision pytest -q

  build-check:
    name: Wheel builds and passes twine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Build sdist + wheel
        run: uv build

      - name: Twine check
        run: uvx twine check dist/*
