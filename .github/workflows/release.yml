# Publish cgh to PyPI on every tag push.
#
# Auth model: PyPI Trusted Publisher (OIDC). No tokens, no secrets. PyPI
# verifies this workflow's GitHub OIDC identity matches the trusted publisher
# configured on https://pypi.org/manage/project/cgh/settings/publishing/
#
# Trusted publisher settings to configure on PyPI ONCE:
#   Owner:                altikva
#   Repository:           cgh
#   Workflow filename:    release.yml
#   Environment name:     pypi
#
# Release flow:
#   1. Bump version in pyproject.toml + commit + push to main
#   2. git tag v0.4.4 && git push --tags
#   3. This workflow validates, builds, publishes to PyPI, and attaches the
#      dists to the GitHub release.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  # Gate: do not build or publish unless the tag matches the version and the
  # suite is green. CI already runs on the merge to main, but the tag can point
  # at any commit, so re-check here.
  validate:
    name: Validate (tag + lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refuse manual dispatch from non-main refs
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::workflow_dispatch runs only from main"
          exit 1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          # uv.lock is committed, so the cache key is stable.
          enable-cache: true

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag v$TAG does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "Releasing cgh $PYPROJECT_VERSION"

      - name: Lint with ruff
        # Pinned to match ci.yml, a new ruff release must not block a tag.
        run: |
          uvx ruff@0.15.9 check .
          uvx ruff@0.15.9 format --check .

      - name: Run pytest
        # Validate on the default Python with the kuzu extra so both backends
        # are exercised. The full 3.11-3.14 matrix runs in ci.yml on the PR.
        run: uv run --with pytest --extra kuzu pytest -q

  build:
    name: Build sdist + wheel
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Check metadata
        run: |
          ls -lh dist/
          uvx twine check dist/*

      - name: Smoke-test the built wheel
        # Install the wheel into a clean venv (default extras, no kuzu) and run
        # the CLI, so a broken entry point or missing data file fails here
        # rather than in a user's terminal.
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/cgh --version

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # `pypi` environment scopes the OIDC token PyPI trusts. Create it in
    # repo Settings -> Environments (no required reviewers unless you want a
    # manual gate before each release).
    environment:
      name: pypi
      url: https://pypi.org/project/cgh/
    permissions:
      # Required for the PyPI Trusted Publisher OIDC exchange.
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Defaults to https://upload.pypi.org/legacy/ when the trusted
        # publisher is configured on PyPI. skip-existing lets a
        # workflow_dispatch re-run publish only what is new (plugin
        # versions move independently of the core tag).
        with:
          skip-existing: true

  publish-plugins:
    name: Publish first-party plugins to PyPI
    needs: validate
    runs-on: ubuntu-latest
    # One GitHub environment PER plugin (pypi-cgh-docs, pypi-cgh-pii, ...):
    # PyPI requires every PENDING trusted publisher to have a unique
    # (owner, repo, workflow, environment) configuration, since before
    # the first upload nothing else can map a token to a project name.
    # Each plugin's PyPI entry therefore uses its matching environment;
    # until an entry exists, that plugin's upload fails without blocking
    # the others.
    environment:
      name: pypi-${{ matrix.plugin }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - cgh-docs
          - cgh-pii
          - cgh-summarize
          - cgh-classify
          - cgh-bugreport
          - cgh-vision
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build ${{ matrix.plugin }}
        run: uv build plugins/${{ matrix.plugin }} --out-dir plugin-dist/

      - name: Publish ${{ matrix.plugin }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: plugin-dist/
          # A tag that does not bump a plugin's version re-uploads the
          # same file; skip instead of failing the whole release.
          skip-existing: true

  github-release:
    name: Attach dists to GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Upload artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  binaries:
    name: Binary ${{ matrix.variant }} (${{ matrix.plat.target }})
    # The GitHub Release must already exist (github-release creates it), so we
    # only upload here. This is a SEPARATE job on purpose: one leg failing
    # (Windows is the usual suspect) loses only that asset, it does not block
    # the release or the other legs. PyInstaller does not cross-compile, so
    # each target builds on its own native runner.
    #
    # TWO variants per target (see packaging/build-binary.sh), named for
    # EGRESS, not a plugin count:
    #   sealed -> cgh-<target>         : core + the local-only plugins (pii,
    #             classify). Provably egress-free, so "the core never phones
    #             home" stays verifiable by absence of the code, not a flag.
    #   egress -> cgh-egress-<target>  : adds the egress-capable plugins
    #             (codegen, summarize, bugreport), gated and inert until
    #             configured. The name is the honest capability, not a state.
    # The heavy native-dep plugins (docs, vision) stay pip-only in both.
    needs: [validate, github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        variant: [sealed, egress]
        plat:
          - { target: macos-arm64, runner: macos-14 }
          - { target: macos-x64, runner: macos-13 }
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: windows-x64, runner: windows-latest }
    runs-on: ${{ matrix.plat.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Build the binary
        shell: bash
        env:
          CGH_VARIANT: ${{ matrix.variant }}
        run: bash packaging/build-binary.sh

      - name: Stage the asset + checksum
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.plat.target }}
        run: |
          # sealed -> cgh-<target>, egress -> cgh-egress-<target>; .exe on Windows.
          prefix="cgh"; [ "$VARIANT" = egress ] && prefix="cgh-egress"
          asset="$prefix-$TARGET"
          # PyInstaller writes cgh (cgh.exe on Windows) into dist-binary/dist.
          src="dist-binary/dist/cgh"
          if [ -f "$src.exe" ]; then src="$src.exe"; asset="$asset.exe"; fi
          mkdir -p out
          cp "$src" "out/$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          ls -lh

      - name: Smoke-test + verify bundled plugins
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          chmod +x "out/$ASSET" 2>/dev/null || true
          "./out/$ASSET" --version
          # The binary is only as bundled as its metadata: without --copy-metadata
          # the plugins vanish silently. Assert the expected set is ACTIVE in the
          # built binary itself, not in the source tree.
          expected="pii classify"
          [ "$VARIANT" = egress ] && expected="pii classify codegen summarize bugreport"
          python3 - "out/$ASSET" $expected <<'PY'
          import json, subprocess, sys
          binp, expected = sys.argv[1], set(sys.argv[2:])
          out = subprocess.run([binp, "plugins", "--json"], capture_output=True, text=True)
          data = json.loads(out.stdout or "[]")
          active = {p["name"] for p in data if p.get("status") == "active"}
          print("active plugins:", sorted(active))
          missing = expected - active
          if missing:
              sys.exit(f"FAIL: expected plugins not active in the binary: {sorted(missing)}")
          print("all expected plugins active")
          PY

      - name: Upload to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "out/$ASSET" "out/$ASSET.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
