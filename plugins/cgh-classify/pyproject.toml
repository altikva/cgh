[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cgh-classify"
version = "0.1.0"
description = "Human-trainable confidentiality classification for cgh: label files, a lightweight local model generalizes, the egress gate enforces"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joy Ndjama", email = "joy.ndjama@altikva.com" }]
# cgh itself is a peer dependency, deliberately not declared: the plugin
# only ever loads through cgh's entry point group, so it is inert without
# cgh installed, and declaring it makes resolvers overlay a second cgh on
# top of a dev checkout. Requires cgh >= 0.6.1 at runtime. The classifier
# is pure standard library: TF-IDF plus naive Bayes, no sklearn, no numpy.
dependencies = []

[project.entry-points.cgh]
classify = "cgh_classify"

[tool.setuptools.packages.find]
include = ["cgh_classify*"]
