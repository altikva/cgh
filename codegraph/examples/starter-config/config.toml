# Starter .codegraph/config.toml. Copy the parts you want into your repo's
# .codegraph/config.toml, then `cgh index --force`.

[codegraph]
# The size cap is in KILOBYTES. 500 (the default) skips files over 0.5 MB,
# which drops many PDFs and spreadsheets. 512000 = 500 MB.
max_file_size_kb = 512000
# Skip generated / vendored noise. Add your own globs.
ignore_patterns = ["*.min.js", "*.bundle.js", "*.map"]

[plugin.pii]
# cgh-pii checks secrets on demand (`cgh pii scan`). To also scan every
# file as it is indexed, turn scan_on_index on; the NER and LLM tiers
# only run with it. The LLM model is auto-picked from what Ollama has
# installed if the named one is absent.
scan_on_index = true
ner = true          # needs: pip install "cgh-pii[ner]"
llm = true          # deferred; emits count-only pii.llm.* findings
llm_model = "qwen2.5:3b"
# A non-loopback LLM endpoint sees file content: opt in, every probe audited.
pii_llm_allow_remote = false
