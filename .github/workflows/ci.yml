# Lint + test gate. Fires on every PR and on pushes to the long-lived
# branches (develop, main) so the integration history stays green.
# release.yml is the only workflow that touches PyPI.

name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

jobs:
  # Gating job: lint + the full supported Python matrix. Kuzu has no cp3.14
  # wheel, so the kuzu extra is installed only on 3.11-3.13; 3.14 runs the
  # default DuckDB-only install and the Kuzu tests skip themselves.
  test:
    name: Lint + tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # Surface the matrix value via env so run: blocks never interpolate
      # ${{ ... }} straight into the shell.
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          # uv.lock is committed, so the cache key is stable.
          enable-cache: true

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Lint with ruff
        # ruff is not a project dependency, so run it via uvx. The format
        # check is not enabled yet (69 files would reformat); do that in a
        # dedicated chore/ruff-format PR, then add `uvx ruff format --check .`.
        run: uvx ruff check .

      - name: Run pytest
        run: |
          if [ "$PYTHON_VERSION" = "3.14" ]; then
            uv run --python "$PYTHON_VERSION" --with pytest pytest -q
          else
            uv run --python "$PYTHON_VERSION" --with pytest --extra kuzu pytest -q
          fi

  # Advisory early-warning job: resolve the newest deps allowed by the
  # pyproject floors instead of the locked versions. Catches "an upstream
  # release broke us" without blocking PRs on transitive breakage.
  # continue-on-error keeps it non-gating.
  test-latest:
    name: Newest deps, advisory (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install Python
        run: uv python install "$PYTHON_VERSION"

      - name: Test on newest deps within floors
        run: |
          if [ "$PYTHON_VERSION" = "3.14" ]; then
            uv run --python "$PYTHON_VERSION" --upgrade --with pytest pytest -q
          else
            uv run --python "$PYTHON_VERSION" --upgrade --with pytest --extra kuzu pytest -q
          fi
