[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgh"
version = "0.4.0"
description = "Local code graph for AI coding agents. Indexes your repo into Kuzu + SQLite FTS, exposes 30+ MCP tools to Claude Code, Cursor, Codex, and Gemini. Federates across sibling repos."
readme = "README.md"
authors = [{ name = "Joy Ndjama", email = "joy.ndjama@altikva.com" }]
maintainers = [{ name = "ALTIKVA", email = "dev@altikva.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
# Upper bound is for kuzu, not cgh itself. Kuzu (0.11.x) does not yet
# publish cp314 wheels, so pip would fall back to building from source
# on Python 3.14 and fail without MSVC + CMake on Windows. Lift this
# cap as soon as kuzu ships cp314 wheels.
keywords = ["code-graph", "mcp", "mcp-server", "claude", "claude-code", "cursor", "code-index", "symbol-lookup", "call-graph", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "kuzu>=0.7",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "watchdog>=4.0",
    "fastmcp>=2.0",
    "rank-bm25>=0.2",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.urls]
Homepage = "https://github.com/altikva/cgh"
Repository = "https://github.com/altikva/cgh"
Issues = "https://github.com/altikva/cgh/issues"

[project.scripts]
cgh = "codegraph.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codegraph", "codegraph.*"]

[tool.setuptools.package-data]
codegraph = ["skills/*/SKILL.md", "skills/*/*.md"]
