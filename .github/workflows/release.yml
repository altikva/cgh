# Publish cgh to PyPI on every tag push.
#
# Auth model: PyPI Trusted Publisher (OIDC). No tokens, no secrets — PyPI
# verifies this workflow's GitHub OIDC identity matches the trusted publisher
# configured on https://pypi.org/manage/project/cgh/settings/publishing/
#
# Trusted publisher settings to configure on PyPI ONCE:
#   Owner:                altikva
#   Repository:           cgh
#   Workflow filename:    release.yml
#   Environment name:     pypi
#
# Release flow:
#   1. Bump version in pyproject.toml + commit + push to main
#   2. git tag v0.3.1 && git push --tags
#   3. This workflow builds, publishes to PyPI, attaches dists to the GitHub release.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Verify tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep -E '^version[[:space:]]*=' pyproject.toml | head -1 | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')
          if [ "$TAG" != "$PYPROJECT_VERSION" ]; then
            echo "::error::tag v$TAG does not match pyproject version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "Building cgh $PYPROJECT_VERSION"

      - name: Build
        run: uv build

      - name: Inspect artifacts
        run: |
          ls -lh dist/
          uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # `pypi` environment scopes the OIDC token PyPI trusts. Create it in
    # repo Settings → Environments (no required reviewers unless you want
    # a manual gate before each release).
    environment:
      name: pypi
      url: https://pypi.org/project/cgh/
    permissions:
      # Required for PyPI Trusted Publisher OIDC exchange
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Defaults to https://upload.pypi.org/legacy/ — no settings needed
        # when the trusted publisher is configured on PyPI.

  github-release:
    name: Attach dists to GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload artifacts to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
