[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cgh-codegen"
version = "0.1.0"
description = "Pattern-matched code generation for cgh: a cheap model writes boilerplate that mirrors a reference file cgh picks from the graph"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joy Ndjama", email = "joy.ndjama@altikva.com" }]
# cgh is a peer dependency, deliberately not declared: the plugin only
# ever loads through cgh's entry-point group, so it is inert without cgh
# installed, and declaring it makes resolvers overlay a second cgh on top
# of a dev checkout. Requires cgh >= 0.11.8 at runtime (the release that
# exposes find_symbol_files on the public plugin API).
dependencies = []

[project.entry-points.cgh]
codegen = "cgh_codegen"

[tool.setuptools.packages.find]
include = ["cgh_codegen*"]

[tool.setuptools.package-data]
cgh_codegen = ["py.typed"]
