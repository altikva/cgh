[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cgh-vision"
version = "0.5.0"
description = "Image understanding for cgh: content inventory, architecture diagram extraction to markdown and Mermaid, table and chart reading, dense text summaries, local vision models via Ollama"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Joy Ndjama", email = "joy.ndjama@altikva.com" }]
# cgh itself is a peer dependency, deliberately not declared: the plugin
# only ever loads through cgh's entry point group, so it is inert without
# cgh installed, and declaring it makes resolvers overlay a second cgh on
# top of a dev checkout. Requires cgh >= 0.10 at runtime. The vision
# models are reached over the local Ollama HTTP API; pillow serves the
# benchmarked 2x pre-scaling of small thin-line diagrams.
dependencies = ["pillow>=10"]

# `cgh vision file.pdf` rasterizes pages to images so the pipeline can read
# a PDF's diagrams. pypdfium2 (PDFium: BSD/Apache, pip wheels, no system
# binary, not AGPL like pymupdf) does the rendering. Kept optional so the
# base install stays small.
[project.optional-dependencies]
pdf = ["pypdfium2>=4"]

[project.entry-points.cgh]
vision = "cgh_vision"

[tool.setuptools.packages.find]
include = ["cgh_vision*"]

[tool.setuptools.package-data]
cgh_vision = ["py.typed", "examples/**/*"]
