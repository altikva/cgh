# Pinned benchmark corpus. Real commit SHAs captured with
#   git ls-remote https://github.com/pallets/flask refs/heads/main
#   git ls-remote https://github.com/psf/requests refs/heads/main
# on 2026-11-17. fetch.py verifies HEAD == sha and refuses to run on a
# drifted checkout, so the numbers always describe these exact trees.
#
# tokenizer names the tiktoken encoding used for every token count. It is
# not Claude's tokenizer, so ratios are relative, never a billable figure.
tokenizer: cl100k_base

repos:
  flask:
    url: https://github.com/pallets/flask
    sha: 49943b5a94413a530761350f04e896f76e8d620e
  requests:
    url: https://github.com/psf/requests
    sha: 3c7baaa05ab4aa49cc819ce3a819d260de19c157
