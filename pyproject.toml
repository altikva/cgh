[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgh"
version = "0.11.7"
description = "Local code graph for AI coding agents. Indexes your repo into an embedded graph DB (DuckDB by default, Kuzu opt-in) plus SQLite FTS, exposes 50 MCP tools to Claude Code, Cursor, Codex, and Gemini. Federates across sibling repos."
readme = "README.md"
authors = [{ name = "Joy Ndjama", email = "joy.ndjama@altikva.com" }]
maintainers = [{ name = "ALTIKVA", email = "dev@altikva.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
# No upper cap as of v0.4.2: DuckDB is the default backend and ships
# cp3.14 wheels. Kuzu moved to an optional extra (`pip install cgh[kuzu]`)
# precisely so 3.14 users could install cgh without Kuzu's missing wheel
# blocking them.
keywords = ["code-graph", "mcp", "mcp-server", "claude", "claude-code", "cursor", "code-index", "symbol-lookup", "call-graph", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    # 1.2 is the real minimum: older binders reject the upsert's
    # ON CONFLICT DO UPDATE against a constrained column.
    "duckdb>=1.2",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "watchdog>=4.0",
    # Upper bound: a fastmcp major can relocate modules the owner
    # imports lazily (4.0 moved fastmcp.server.tasks to
    # fastmcp.utilities.tasks). Keep the next major from arriving on an
    # unrelated reinstall; raise the ceiling deliberately after testing.
    "fastmcp>=2.0,<5",
    "rank-bm25>=0.2",
    "rich>=13.0",
    "questionary>=2.0",
    # Used directly by the YAML section parser; declared so the nested
    # sections it tests for do not depend on a transitive install.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Install with `pip install cgh[kuzu]` to enable the legacy Kuzu backend
# (selected via `CGH_DB=kuzu` or on-disk detection of an existing
# `.codegraph/graph.db`). Kuzu has no cp3.14 wheels yet, so on Python
# 3.14 you'll either need a source build (CMake + a C++17 compiler) or
# you can skip the extra entirely and use the default DuckDB backend.
kuzu = ["kuzu>=0.7"]
# The six first-party plugins in one install:
#   pip install "cgh[plugins]"      or:  uv tool install "cgh[plugins]"
plugins = [
    "cgh-docs>=0.2",
    "cgh-pii>=0.3.1",
    "cgh-summarize>=0.2.4",
    "cgh-classify>=0.1.3",
    "cgh-bugreport>=0.1.1",
    "cgh-vision[pdf]>=0.5",
]
# Everything except the legacy kuzu backend: the six plugins plus the
# langs and lsp extras. The tree-sitter grammars ship abi3 wheels
# (cp310-abi3, so any Python cgh supports) and jedi is pure Python,
# which is what makes this superset safe to offer.
#   pip install "cgh[full]"
full = [
    "cgh-docs>=0.2",
    "cgh-pii>=0.3.1",
    "cgh-summarize>=0.2.4",
    "cgh-classify>=0.1.3",
    "cgh-bugreport>=0.1.1",
    "cgh-vision[pdf]>=0.5",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
    "jedi>=0.19",
]

# Install with `pip install cgh[langs]` to add the optional tree-sitter
# language parsers (C# and Ruby). They are kept out of the core dependency
# list so the base install stays lean and Python-3.14-safe: if a grammar
# lacks a 3.14 wheel it cannot block a core install. When the extra is not
# present these parsers simply never register (see _discover_parsers).
langs = [
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
]

# Install with `pip install cgh[lsp]` to enable opt-in precise CALLS
# resolution for Python. jedi is the static-analysis engine python-lsp-server
# wraps; we use it directly to do goto-definition on call sites instead of
# spawning a full LSP subprocess. Kept out of core deps: the resolver imports
# jedi lazily and the `precise_calls` config flag is off by default, so a base
# install never depends on it. See codegraph/analysis/precise_calls.py.
lsp = ["jedi>=0.19"]

[project.urls]
Homepage = "https://github.com/altikva/cgh"
Repository = "https://github.com/altikva/cgh"
Issues = "https://github.com/altikva/cgh/issues"
Changelog = "https://github.com/altikva/cgh/blob/main/CHANGELOG.md"

[project.scripts]
cgh = "codegraph.__main__:main"

[project.gui-scripts]
# Same entry point, windowless launcher on Windows. Console apps
# spawned by a windowless parent (the Claude Code hooks fire on
# every tool call) each flash a conhost window; cghw.exe is built
# from the GUI subsystem so it never does. No effect on POSIX.
cghw = "codegraph.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
# `cgh` is a thin entry shim so `python -m cgh` works; the real code lives in
# `codegraph` (import name stays `codegraph`, like pillow / PIL).
include = ["codegraph", "codegraph.*", "cgh"]

[tool.setuptools.package-data]
codegraph = [
    "py.typed",
    "skills/*/SKILL.md",
    "skills/*/*.md",
    # Bundled examples, shipped in the wheel so `cgh examples install` works
    # with no git checkout and no network.
    "examples/**/*",
]

[dependency-groups]
# The declared dev toolchain: local and CI run the same artifact
# instead of ad hoc --with flags (ruff stays pinned via uvx in the
# workflows so a release cannot be blocked by a linter release).
dev = [
    "pytest>=8",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Explicit selection: the defaults are only E4/E7/E9/F, which leaves
# bugbear, security, simplify and modernize OFF. Every ignore below is
# a conscious decision, not a leftover.
select = ["E", "F", "B", "I", "S", "SIM", "UP", "RUF"]
ignore = [
    # The formatter is the line-length authority; long literals stay.
    "E501",
    # Audited posture: argv lists only, timeouts everywhere, `--`
    # separators for agent input (see the 2026-07-31 audit). S603 flags
    # every subprocess call and S607 the deliberate PATH resolution of
    # git/gh/agent CLIs.
    "S603", "S607",
    # try/except-pass and -continue were triaged by the audit: write
    # paths log or propagate, the remainder is deliberate best-effort
    # (probes, cleanup, display). The review rule, not a lint, guards
    # new ones.
    "S110", "S112",
    # contextlib.suppress is not house style; explicit except blocks
    # carry the triage comments the rules require.
    "SIM105",
    # Mutable class defaults: mostly ClassVar-style tables in parsers;
    # adopt progressively, not as one sweep.
    "RUF012",
    # French prose in user-facing strings trips the ambiguous-unicode
    # detectors (apostrophes, NBSP).
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# assert is the test idiom.
"tests/**" = ["S101", "S105", "S108", "S608"]
# E402: the importorskip(<plugin>) guard legitimately precedes imports.
"plugins/*/tests/**" = ["S101", "S105", "S108", "E402"]
"internal/bench/**" = ["S101", "S310"]
"examples/**" = ["S101"]
# The two adapters interpolate identifiers behind checked_identifier
# (allow-list gate); the sidecar SQLite modules build clause lists from
# constants. S608 cannot see the gate.
"codegraph/core/db_duckdb.py" = ["S608"]
"codegraph/core/db_kuzu.py" = ["S608"]
"codegraph/core/fts.py" = ["S608"]
"codegraph/state/*.py" = ["S608"]
"codegraph/claude_state/*.py" = ["S608"]
# Loopback-only HTTP (owner bridge, Ollama daemon), audited: no
# user-controlled URLs.
"codegraph/**" = ["S310"]
"plugins/cgh-vision/**" = ["S310"]
"plugins/cgh-summarize/**" = ["S310"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
# The plugin suites self-skip (importorskip) when their package is not
# installed, so collecting them here costs nothing locally and runs
# them for real in CI, where every plugin is installed.
testpaths = ["tests", "plugins"]
markers = [
    "kuzu: needs the optional kuzu backend installed",
    "network: talks to a local daemon or the network",
]

