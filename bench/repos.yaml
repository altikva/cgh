# Pinned benchmark corpus. Real commit SHAs captured with
#   git ls-remote --symref https://github.com/<owner>/<repo> HEAD
# (the default branch tip) on 2026-11-17. fetch.py verifies HEAD == sha and
# refuses to run on a drifted checkout, so the numbers always describe these
# exact trees.
#
# Results are published BY LANGUAGE (see BENCHMARK.md): a weak language is
# measured and shown, never hidden. `base` is the repo's default branch, used
# by the mechanical PR selection.
#
# tokenizer names the tiktoken encoding used for every token count. It is
# not Claude's tokenizer, so ratios are relative, never a billable figure.
tokenizer: cl100k_base

repos:
  flask:
    url: https://github.com/pallets/flask
    sha: 49943b5a94413a530761350f04e896f76e8d620e
    language: python
    base: main
