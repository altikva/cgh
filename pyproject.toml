[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgh"
version = "0.8.0"
description = "Local code graph for AI coding agents. Indexes your repo into an embedded graph DB (DuckDB by default, Kuzu opt-in) plus SQLite FTS, exposes 30+ MCP tools to Claude Code, Cursor, Codex, and Gemini. Federates across sibling repos."
readme = "README.md"
authors = [{ name = "Joy Ndjama", email = "joy.ndjama@altikva.com" }]
maintainers = [{ name = "ALTIKVA", email = "dev@altikva.com" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
# No upper cap as of v0.4.2: DuckDB is the default backend and ships
# cp3.14 wheels. Kuzu moved to an optional extra (`pip install cgh[kuzu]`)
# precisely so 3.14 users could install cgh without Kuzu's missing wheel
# blocking them.
keywords = ["code-graph", "mcp", "mcp-server", "claude", "claude-code", "cursor", "code-index", "symbol-lookup", "call-graph", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: Free for non-commercial use",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "duckdb>=1.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-java>=0.23",
    "watchdog>=4.0",
    "fastmcp>=2.0",
    "rank-bm25>=0.2",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
# Install with `pip install cgh[kuzu]` to enable the legacy Kuzu backend
# (selected via `CGH_DB=kuzu` or on-disk detection of an existing
# `.codegraph/graph.db`). Kuzu has no cp3.14 wheels yet, so on Python
# 3.14 you'll either need a source build (CMake + a C++17 compiler) or
# you can skip the extra entirely and use the default DuckDB backend.
kuzu = ["kuzu>=0.7"]
# The five first-party plugins in one install:
#   pip install "cgh[plugins]"      or:  uv tool install "cgh[plugins]"
plugins = [
    "cgh-docs>=0.1",
    "cgh-pii>=0.1",
    "cgh-summarize>=0.2",
    "cgh-classify>=0.1",
    "cgh-bugreport>=0.1",
]
# Everything except the legacy kuzu backend: the five plugins plus the
# langs and lsp extras. The tree-sitter grammars ship abi3 wheels
# (cp310-abi3, so any Python cgh supports) and jedi is pure Python,
# which is what makes this superset safe to offer.
#   pip install "cgh[full]"
full = [
    "cgh-docs>=0.1",
    "cgh-pii>=0.1",
    "cgh-summarize>=0.2",
    "cgh-classify>=0.1",
    "cgh-bugreport>=0.1",
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
    "jedi>=0.19",
]

# Install with `pip install cgh[langs]` to add the optional tree-sitter
# language parsers (C# and Ruby). They are kept out of the core dependency
# list so the base install stays lean and Python-3.14-safe: if a grammar
# lacks a 3.14 wheel it cannot block a core install. When the extra is not
# present these parsers simply never register (see _discover_parsers).
langs = [
    "tree-sitter-c-sharp>=0.23",
    "tree-sitter-ruby>=0.23",
]

# Install with `pip install cgh[lsp]` to enable opt-in precise CALLS
# resolution for Python. jedi is the static-analysis engine python-lsp-server
# wraps; we use it directly to do goto-definition on call sites instead of
# spawning a full LSP subprocess. Kept out of core deps: the resolver imports
# jedi lazily and the `precise_calls` config flag is off by default, so a base
# install never depends on it. See codegraph/analysis/precise_calls.py.
lsp = ["jedi>=0.19"]

[project.urls]
Homepage = "https://github.com/altikva/cgh"
Repository = "https://github.com/altikva/cgh"
Issues = "https://github.com/altikva/cgh/issues"
Changelog = "https://github.com/altikva/cgh/blob/main/CHANGELOG.md"

[project.scripts]
cgh = "codegraph.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
# `cgh` is a thin entry shim so `python -m cgh` works; the real code lives in
# `codegraph` (import name stays `codegraph`, like pillow / PIL).
include = ["codegraph", "codegraph.*", "cgh"]

[tool.setuptools.package-data]
codegraph = ["skills/*/SKILL.md", "skills/*/*.md"]
